name: Saimon CI

on:
  push:
    branches: [main, rc, dev]
  pull_request:
    branches: [main, rc, dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Validate (all branches) ──────────────────────────────────────
  # Pinned to the `staging` label: general-prod-build also carries
  # self-hosted/Linux/X64, so a bare [self-hosted, Linux, X64] target lets this
  # 15-30 min suite land on the prod box and compete with everything else there.
  validate:
    runs-on: [self-hosted, Linux, X64, staging]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pip-audit

      - name: Ruff lint
        run: ruff check research_shared/ saimon_mcp/

      - name: Compile check
        run: python -m compileall research_shared/ saimon_mcp/

      - name: Dependency audit
        run: pip-audit --requirement requirements.txt || echo "⚠️ pip-audit found issues — review above"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Validate OpenAPI spec
        run: python scripts/validate_openapi_spec.py

  # ── Offline eval gate (all branches) ──────────────────────────────
  # SAIMON-EVAL-CI-GATE-1 (#27): the committed golden fixture suites must
  # pass offline. Pure Python + stdlib — no network, no model keys.
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run offline eval gate
        run: python3 scripts/eval.py gate --fixtures-root fixtures

  # ── Build & push Docker image (dev, rc, and main branches, pushes to GHCR) ─
  # Runs on the `build`-labelled runner: the image is 3.6 GB and a build needs
  # ~6-8 GB of free layer space, which the 38 GB staging runner does not have
  # (its docker-push jobs died with "No space left on device"). general-prod-build
  # gives the build a host with headroom; the staging runner keeps validate/deploy.
  docker-push:
    runs-on: [self-hosted, Linux, X64, build]
    timeout-minutes: 20
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/rc' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Pushed ${{ steps.meta.outputs.tags }}"

  # ── Deploy to staging (rc branch only) ──────────────────────────
  deploy-staging:
    runs-on: [self-hosted, deploy]
    timeout-minutes: 10
    needs: docker-push
    if: github.ref == 'refs/heads/rc'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Back up compose files
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /data/planning/saimon
            stamp=$(date +%Y%m%d)
            cp -n docker-compose.yml docker-compose.yml.bak-$stamp
            cp -n docker-compose.staging.yml docker-compose.staging.yml.bak-$stamp
            cp -n schema.sql schema.sql.bak-$stamp

      - name: Sync compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.staging.yml,schema.sql"
          target: /data/planning/saimon/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -e
            cd /data/planning/saimon
            # The rc image is a PRIVATE GHCR package: without a login this pull
            # answers "unauthorized". docker-push used to run on this same host
            # and left credentials behind; it runs on the build runner now, so
            # the deploy must authenticate for itself.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            echo "Pulling latest rc image..."
            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull
            echo "Restarting services..."
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --force-recreate --no-build
            echo "Cleaning up old images..."
            docker image prune -f
            echo "Health checks..."
            for port in 8101 8102 8103 8104 8105 8106 8107 8108; do
              for i in 1 2 3 4 5; do
                status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$port/health 2>/dev/null || echo '000')
                if [ "$status" = "200" ]; then
                  echo "  port $port: OK"
                  break
                fi
                sleep 3
              done
            done
            echo "Deploy complete."

  # ── Deploy to production (main branch only) ──────────────────────────
  deploy-production:
    runs-on: [self-hosted, deploy]
    timeout-minutes: 10
    needs: docker-push
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Back up compose files
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /data/saimon
            stamp=$(date +%Y%m%d)
            cp -n docker-compose.yml docker-compose.yml.bak-$stamp
            cp -n docker-compose.prod.yml docker-compose.prod.yml.bak-$stamp
            cp -n schema.sql schema.sql.bak-$stamp

      - name: Sync compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,schema.sql"
          target: /data/saimon/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -e
            cd /data/saimon
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            echo "Pulling latest main image..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            echo "Restarting services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate --no-build
            echo "Cleaning up old images..."
            docker image prune -f
            echo "Health checks..."
            for port in 8101 8102 8103 8104 8105 8106 8107 8108; do
              for i in 1 2 3 4 5; do
                status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$port/health 2>/dev/null || echo '000')
                if [ "$status" = "200" ]; then
                  echo "  port $port: OK"
                  break
                fi
                sleep 3
              done
            done
            echo "Deploy complete."

  # ── Docker build only (rc branch, for verification) ──────
  # REMOVED: it rebuilt the same image `docker-push` already builds AND pushes
  # on the same ref, on a runner whose disk cannot hold a 3.6 GB build — it was
  # the only red on the rc ladder (buildx "error reading from server: EOF" plus
  # a missing GITHUB_EVENT_PATH = the staging host ran out of disk mid-build).
  # `docker-push` succeeding on `build` is the build verification.
