name: Saimon CI

on:
  push:
    branches: [main, rc, dev]
  pull_request:
    branches: [main, rc, dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Validate (all branches) ──────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pip-audit

      - name: Ruff lint
        run: ruff check research_shared/ mcp/

      - name: Compile check
        run: python -m compileall research_shared/ mcp/

      - name: Dependency audit
        run: pip-audit --requirement requirements.txt || echo "⚠️ pip-audit found issues — review above"

      - name: Run tests
        run: python -m pytest tests/ -q

  # ── Build & push Docker image (dev and main branches, pushes to GHCR) ─
  docker-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Pushed ${{ steps.meta.outputs.tags }}"

  # ── Deploy to staging (dev branch only) ──────────────────────────
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: docker-push
    if: github.ref == 'refs/heads/dev'
    environment: staging

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /data/planning/saimon
            echo "Pulling latest dev image..."
            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull
            echo "Restarting services..."
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --force-recreate
            echo "Cleaning up old images..."
            docker image prune -f
            echo "Health checks..."
            for port in 8101 8102 8103 8104 8105 8106; do
              for i in 1 2 3 4 5; do
                status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$port/health 2>/dev/null || echo '000')
                if [ "$status" = "200" ]; then
                  echo "  port $port: OK"
                  break
                fi
                sleep 3
              done
            done
            echo "Deploy complete."

  # ── Deploy to production (main branch only) ──────────────────────────
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: docker-push
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /data/planning/saimon
            echo "Pulling latest main image..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            echo "Restarting services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate
            echo "Cleaning up old images..."
            docker image prune -f
            echo "Health checks..."
            for port in 8101 8102 8103 8104 8105 8106; do
              for i in 1 2 3 4 5; do
                status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$port/health 2>/dev/null || echo '000')
                if [ "$status" = "200" ]; then
                  echo "  port $port: OK"
                  break
                fi
                sleep 3
              done
            done
            echo "Deploy complete."

  # ── Docker build only (rc branch, for verification) ──────
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    if: github.ref == 'refs/heads/rc'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: saimon:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
