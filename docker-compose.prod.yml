# Production docker-compose overrides for Saimon Platform.
#
# Usage:
#   cp .env.example .env   # then fill in real secrets
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from dev:
# - No default API keys (secrets must come from .env).
# - Resource limits on all services.
# - JSON-file logging with rotation.
# - Restart policy set to "always".
# - PostgreSQL data volume is persistent.

services:
  # -----------------------------------------------------------------------
  # PostgreSQL 16 — production hardening
  # -----------------------------------------------------------------------
  postgres:
    restart: always
    ports: !override
      - "127.0.0.1:5433:5432"
    volumes:
      - saimon_pgdata:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  # -----------------------------------------------------------------------
  # search-mcp (port 8001)
  # -----------------------------------------------------------------------
  search-mcp:
    image: ghcr.io/sv-copilot/saimon:main
    restart: always
    environment:
      PORT: "8001"
      SAIMON_API_KEY: ${SAIMON_SEARCH_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      SAIMON_ENV: production
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      SAIMON_S3_ENDPOINT: ${SAIMON_S3_ENDPOINT}
      SAIMON_S3_ACCESS_KEY: ${SAIMON_S3_ACCESS_KEY}
      SAIMON_S3_SECRET_KEY: ${SAIMON_S3_SECRET_KEY}
      SAIMON_S3_BUCKET: ${SAIMON_S3_BUCKET}
    ports: !override
      - "127.0.0.1:8101:8001"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "128M"

  # -----------------------------------------------------------------------
  # generate-mcp (port 8002)
  # -----------------------------------------------------------------------
  generate-mcp:
    image: ghcr.io/sv-copilot/saimon:main
    restart: always
    environment:
      PORT: "8002"
      SAIMON_API_KEY: ${SAIMON_GENERATE_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VERIFY_MCP_URL: ${VERIFY_MCP_URL:-http://verify-mcp:8005}
      VERIFY_MCP_API_KEY: ${VERIFY_MCP_API_KEY:-}
      EVALUATE_MCP_URL: ${EVALUATE_MCP_URL:-http://evaluate-mcp:8004}
      SAIMON_AI_DETECT_MAX_RETRIES: ${SAIMON_AI_DETECT_MAX_RETRIES:-3}
      SAIMON_AI_DETECT_THRESHOLD: ${SAIMON_AI_DETECT_THRESHOLD:-0.5}
      SAIMON_ENV: production
    ports: !override
      - "127.0.0.1:8102:8002"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "256M"

  # -----------------------------------------------------------------------
  # export-mcp (port 8003)
  # -----------------------------------------------------------------------
  export-mcp:
    image: ghcr.io/sv-copilot/saimon:main
    restart: always
    environment:
      PORT: "8003"
      SAIMON_API_KEY: ${SAIMON_EXPORT_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      SAIMON_ENV: production
    ports: !override
      - "127.0.0.1:8103:8003"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "128M"

  # -----------------------------------------------------------------------
  # evaluate-mcp (port 8004)
  # -----------------------------------------------------------------------
  evaluate-mcp:
    image: ghcr.io/sv-copilot/saimon:main
    restart: always
    environment:
      PORT: "8004"
      SAIMON_API_KEY: ${SAIMON_EVALUATE_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      SAIMON_ENV: production
    ports: !override
      - "127.0.0.1:8104:8004"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "256M"

  # -----------------------------------------------------------------------
  # verify-mcp (port 8005)
  # -----------------------------------------------------------------------
  verify-mcp:
    image: ghcr.io/sv-copilot/saimon:main
    restart: always
    environment:
      PORT: "8005"
      SAIMON_API_KEY: ${SAIMON_VERIFY_API_KEY}
      SEARCH_API_KEY: ${SAIMON_SEARCH_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SAIMON_ENV: production
    ports: !override
      - "127.0.0.1:8105:8005"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "256M"

  # -----------------------------------------------------------------------
  # explore-mcp (port 8006)
  # -----------------------------------------------------------------------
  explore-mcp:
    image: ghcr.io/sv-copilot/saimon:main
    restart: always
    environment:
      PORT: "8006"
      SAIMON_API_KEY: ${SAIMON_EXPLORE_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      SAIMON_ENV: production
    ports: !override
      - "127.0.0.1:8106:8006"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "128M"

  # -----------------------------------------------------------------------
  # api-mcp (port 8007) — auth, sessions, documents
  # -----------------------------------------------------------------------
  api-mcp:
    image: ghcr.io/sv-copilot/saimon:main
    restart: always
    environment:
      SAIMON_S3_ENDPOINT: ${SAIMON_S3_ENDPOINT}
      SAIMON_S3_ACCESS_KEY: ${SAIMON_S3_ACCESS_KEY}
      SAIMON_S3_SECRET_KEY: ${SAIMON_S3_SECRET_KEY}
      SAIMON_S3_BUCKET: ${SAIMON_S3_BUCKET}
      PORT: "8007"
      DATABASE_URL: ${DATABASE_URL}
      SAIMON_JWT_SECRET: ${SAIMON_JWT_SECRET}
      SAIMON_ENV: production
    ports: !override
      - "127.0.0.1:8107:8007"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "128M"

  # -----------------------------------------------------------------------
  # domain-mcp (port 8008) — domain plugin loader + tool router
  # -----------------------------------------------------------------------
  domain-mcp:
    image: ghcr.io/sv-copilot/saimon:main
    restart: always
    environment:
      PORT: "8008"
      SAIMON_API_KEY: ${SAIMON_DOMAIN_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      SAIMON_DOMAIN_PLUGIN_PATHS: ${SAIMON_DOMAIN_PLUGIN_PATHS}
      SAIMON_ENV: production
    ports: !override
      - "127.0.0.1:8108:8008"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "128M"

  # -----------------------------------------------------------------------
  # crew-mcp (port 8009) — CrewAI crews
  # -----------------------------------------------------------------------
  crew-mcp:
    image: ghcr.io/sv-copilot/saimon:main
    restart: always
    environment:
      PORT: "8009"
      SAIMON_API_KEY: ${SAIMON_CREW_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      SAIMON_ENV: production
    ports: !override
      - "127.0.0.1:8109:8009"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "256M"

  # -----------------------------------------------------------------------
  # Metabase — read-only BI over the shared Postgres
  # -----------------------------------------------------------------------
  metabase:
    image: metabase/metabase:v0.50.36
    restart: always
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
    ports: !override
      - "127.0.0.1:3010:3000"
    depends_on:
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
        reservations:
          cpus: "0.25"
          memory: "512M"

volumes:
  saimon_pgdata:
    external: true
    name: saimon_saimon_pgdata
